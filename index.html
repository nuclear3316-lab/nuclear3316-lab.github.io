<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Página compartida</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f2;
        --surface: #ffffff;
        --ink: #1c1e21;
        --ink-soft: #5a6068;
        --line: #d9d9d4;
        --field-bg: #ffffff;
        --accent: #205c4d;
        --accent-hover: #184739;
        --accent-ink: #ffffff;
        --error-bg: #fbeae8;
        --error-ink: #8f1d12;
        --error-line: #e5b6b0;
        --focus: #205c4d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --surface: #1e2126;
          --ink: #ecedef;
          --ink-soft: #a3a9b1;
          --line: #34383f;
          --field-bg: #17191d;
          --accent: #3d9b80;
          --accent-hover: #4db095;
          --accent-ink: #0e1512;
          --error-bg: #3a1e1b;
          --error-ink: #f0a99f;
          --error-line: #6e3a34;
          --focus: #3d9b80;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main {
        width: 100%;
        max-width: 380px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 32px 28px 28px;
      }
      .lock {
        width: 44px;
        height: 44px;
        margin-bottom: 18px;
        color: var(--accent);
      }
      h1 {
        font-size: 1.35rem;
        line-height: 1.25;
        margin: 0 0 8px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p.intro {
        margin: 0 0 22px;
        color: var(--ink-soft);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field-row {
        display: flex;
        gap: 8px;
      }
      input[type="password"],
      input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 44px;
        padding: 10px 12px;
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
        background: var(--field-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
        border-color: var(--focus);
      }
      .toggle {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 12px;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--ink-soft);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      .toggle:hover { color: var(--ink); }
      button.unlock {
        width: 100%;
        min-height: 46px;
        margin-top: 16px;
        padding: 11px 16px;
        font: inherit;
        font-size: 1rem;
        font-weight: 650;
        color: var(--accent-ink);
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button.unlock:hover:not(:disabled) { background: var(--accent-hover); }
      button.unlock:disabled { opacity: 0.6; cursor: wait; }
      button:focus-visible, .toggle:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .error {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--error-ink);
        background: var(--error-bg);
        border: 1px solid var(--error-line);
        border-radius: 6px;
      }
      .error.visible { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect>
          <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"></path>
          <circle cx="12" cy="15.2" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
        <h1>Página compartida</h1>
        <p class="intro">Esta página está protegida. Escribe la contraseña para ver su contenido.</p>
        <form id="form-desbloqueo" novalidate>
          <label for="campo-contrasena">Contraseña</label>
          <div class="field-row">
            <input type="password" id="campo-contrasena" name="contrasena" autocomplete="current-password" autocapitalize="none" spellcheck="false" required />
            <button type="button" class="toggle" id="boton-mostrar" aria-pressed="false">Mostrar</button>
          </div>
          <button type="submit" class="unlock" id="boton-desbloquear">Desbloquear</button>
          <p class="error" id="mensaje-error" role="alert"></p>
        </form>
      </div>
    </main>

    <script>
      (function () {
        var form = document.getElementById('form-desbloqueo');
        var campo = document.getElementById('campo-contrasena');
        var boton = document.getElementById('boton-desbloquear');
        var botonMostrar = document.getElementById('boton-mostrar');
        var error = document.getElementById('mensaje-error');

        function base64ABytes(texto) {
          var binario = atob(texto);
          var bytes = new Uint8Array(binario.length);
          for (var i = 0; i < binario.length; i++) {
            bytes[i] = binario.charCodeAt(i);
          }
          return bytes;
        }

        function mostrarError(mensaje) {
          error.textContent = mensaje;
          error.classList.add('visible');
        }

        function ocultarError() {
          error.textContent = '';
          error.classList.remove('visible');
        }

        botonMostrar.addEventListener('click', function () {
          var mostrar = campo.type === 'password';
          campo.type = mostrar ? 'text' : 'password';
          botonMostrar.textContent = mostrar ? 'Ocultar' : 'Mostrar';
          botonMostrar.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
          campo.focus();
        });

        campo.addEventListener('input', ocultarError);

        form.addEventListener('submit', function (evento) {
          evento.preventDefault();
          ocultarError();

          var contrasena = campo.value;
          if (!contrasena) {
            mostrarError('Escribe una contraseña para continuar.');
            campo.focus();
            return;
          }

          if (!window.crypto || !window.crypto.subtle) {
            mostrarError('Tu navegador no permite el desbloqueo seguro de esta página. Prueba con un navegador actualizado.');
            return;
          }

          boton.disabled = true;
          campo.disabled = true;
          boton.textContent = 'Desbloqueando…';

          var paquete;
          try {
            paquete = JSON.parse(document.getElementById('paquete-encriptado').textContent);
          } catch (e) {
            boton.disabled = false;
            campo.disabled = false;
            boton.textContent = 'Desbloquear';
            mostrarError('No se pudo leer el contenido protegido. Vuelve a intentarlo.');
            return;
          }

          var codificador = new TextEncoder();
          var claveMaterial;
          var clave;

          crypto.subtle.importKey('raw', codificador.encode(contrasena), 'PBKDF2', false, ['deriveKey'])
            .then(function (material) {
              claveMaterial = material;
              return crypto.subtle.deriveKey(
                {
                  name: 'PBKDF2',
                  salt: base64ABytes(paquete.salt),
                  iterations: paquete.iter || 210000,
                  hash: 'SHA-256'
                },
                claveMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
              );
            })
            .then(function (claveDerivada) {
              clave = claveDerivada;
              return crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: base64ABytes(paquete.iv) },
                clave,
                base64ABytes(paquete.data)
              );
            })
            .then(function (datos) {
              var texto = new TextDecoder('utf-8').decode(datos);
              var salida = texto;

              // El editor puede guardar el contenido como campos separados
              // ({"html": "...", "css": "...", "js": "..."}) en vez de un
              // documento HTML completo. En ese caso se arma el documento
              // para que se vea como página y no como texto crudo.
              try {
                var contenido = JSON.parse(texto);
                if (
                  contenido &&
                  typeof contenido === 'object' &&
                  (typeof contenido.html === 'string' ||
                    typeof contenido.css === 'string' ||
                    typeof contenido.js === 'string')
                ) {
                  var css = typeof contenido.css === 'string' ? contenido.css : '';
                  var cuerpo = typeof contenido.html === 'string' ? contenido.html : '';
                  var js = typeof contenido.js === 'string'
                    ? contenido.js
                    : (typeof contenido.javascript === 'string' ? contenido.javascript : '');
                  salida =
                    '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8" />\n' +
                    '<meta name="viewport" content="width=device-width, initial-scale=1" />\n' +
                    '<style>\n' + css.replace(/<\/style/gi, '<\\/style') + '\n</style>\n</head>\n<body>\n' +
                    cuerpo +
                    (js ? '\n<script>\n' + js.replace(/<\/script/gi, '<\\/script') + '\n<\/script>\n' : '') +
                    '\n</body>\n</html>';
                }
              } catch (e) {
                // No es JSON: se interpreta como HTML tal cual.
              }

              document.open();
              document.write(salida);
              document.close();
            })
            .catch(function () {
              boton.disabled = false;
              campo.disabled = false;
              boton.textContent = 'Desbloquear';
              mostrarError('Contraseña incorrecta. Revisa la contraseña e inténtalo de nuevo.');
              campo.select();
              campo.focus();
            });
        });

        campo.focus();
      })();
    </script>
  </body>
</html>
